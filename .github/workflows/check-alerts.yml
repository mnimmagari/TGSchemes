name: Check farmer notices

on:
  schedule:
    - cron: "30 4 * * *"    # 10:00 IST (GitHub cron runs in UTC)
    - cron: "30 12 * * *"   # 18:00 IST
  workflow_dispatch:         # "Run workflow" button for a manual check
  push:
    branches: [main]
    paths-ignore: ["data/**"]   # redeploy the site when index.html changes

permissions:
  contents: read             # least privilege by default; raised per job below

concurrency:
  group: farmer-alerts
  cancel-in-progress: false

jobs:
  # 1) Reads untrusted web pages and PDFs. Has NO write access to the repository.
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      models: read           # free GitHub Models inference with the automatic token
    steps:
      # TODO(security): pin each action to a full commit SHA (see README).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Check official sources and summarise new notices
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'github' }}      # set repo variable to "anthropic" to use Claude
          AI_MODEL: ${{ vars.AI_MODEL }}                        # optional override, e.g. openai/gpt-4.1-mini
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}  # PAT only needed if your org blocks the default
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # only used when AI_PROVIDER=anthropic
          MAX_NEW_PER_RUN: "8"
        run: python scripts/collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: alert-data
          path: |
            data/alerts.json
            data/archive.json
            data/seen.json
          retention-days: 1

  # 2) Commits the new data. Never runs the collector or parses downloaded files.
  save:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: alert-data
          path: data
      - name: Validate and commit
        run: |
          for f in data/alerts.json data/archive.json data/seen.json; do
            python3 -m json.tool "$f" > /dev/null   # refuse to commit malformed data
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts.json data/archive.json data/seen.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update farmer alerts ($(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST'))"
            git push origin HEAD:main
          fi

  # 3) Publishes the page and its public data to GitHub Pages.
  deploy:
    needs: [collect, save]
    if: >-
      always() &&
      contains(fromJSON('["success","skipped"]'), needs.collect.result) &&
      contains(fromJSON('["success","skipped"]'), needs.save.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Build site folder (page + public data only)
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/alerts.json _site/data/
          if [ -f data/archive.json ]; then cp data/archive.json _site/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
