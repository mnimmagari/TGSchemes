name: Check farmer notices

on:
  schedule:
    - cron: "30 4 * * *"    # 10:00 IST (GitHub cron runs in UTC)
    - cron: "30 12 * * *"   # 18:00 IST
  workflow_dispatch:         # "Run workflow" button for a manual check
  push:
    branches: [main]
    paths-ignore: ["data/**"]   # redeploy the site when index.html changes

permissions:
  contents: read             # least privilege by default; raised per job below

concurrency:
  group: farmer-alerts
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write        # only to commit data/*.json
    steps:
      # TODO(security): pin each action to a full commit SHA (see README).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # no write token on disk while untrusted PDFs are parsed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Check official sources and summarise new notices
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_NEW_PER_RUN: "8"
        run: python scripts/collect.py
      - name: Save updated alerts
        env:
          GH_TOKEN: ${{ github.token }}   # write token exists only in this step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts.json data/archive.json data/seen.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update farmer alerts ($(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST'))"
            REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git pull --rebase --autostash "$REMOTE" main
            git push "$REMOTE" HEAD:main
          fi

  deploy:
    needs: collect
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # include the data commit made by the collect job
      - name: Build site folder (page + public data only)
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/alerts.json _site/data/
          if [ -f data/archive.json ]; then cp data/archive.json _site/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
